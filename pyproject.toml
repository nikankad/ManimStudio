[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-studio"
version = "0.2.0"
description = "Manim Studio: drag-and-drop visual editor for manim (Community Edition) videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # term-split equations rely on MathTex's per-part \special groups (0.20+); the preview runs manim's own frame
  # loop in place of CairoRenderer.play (runtime.py), verified against 0.22 by tests/test_native_parity.py
  "manim>=0.22,<0.23",
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
manim-studio = "mathengine.__main__:main"
mathengine = "mathengine.__main__:main"  # earlier name

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]

[tool.hatch.build.targets.wheel]
packages = ["mathengine"]
artifacts = ["mathengine/web/**", "mathengine/_build.py"]  # _build.py: release builds only
