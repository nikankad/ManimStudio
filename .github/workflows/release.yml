# Every push to main: test, build the app for Windows, macOS and Linux, and publish a GitHub release
# with the downloads. Versions are <major>.<minor> from pyproject.toml plus the run number (v0.1.57).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(python3 -c "import tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; print('.'.join(v.split('.')[:2]))")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config ffmpeg \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended dvisvgm cm-super-minimal
      - run: pip install ".[dev]"
      - run: pytest -q

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, optional: false }
          - { os: macos-14, name: macos-arm64, optional: false }
          - { os: macos-15-intel, name: macos-x64, optional: true }
          - { os: ubuntu-22.04, name: linux-x64, optional: false } # older glibc: runs on more distributions
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the web interface
        working-directory: frontend
        run: npm ci && npm run build

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3
      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - name: Install MathEngine and PyInstaller
        run: |
          python -m pip install -U pip
          if [ "$RUNNER_OS" = "Linux" ]; then extra="pywebview[qt]"; fi
          pip install . pyinstaller $extra

      - name: Package
        working-directory: packaging
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build mathengine.spec

      - name: Smoke test the packaged app
        run: |
          case "$RUNNER_OS" in
            macOS) dir=dist/MathEngine.app/Contents/MacOS; cli=$dir/mathengine-cli ;;
            Windows) cli=dist/MathEngine/mathengine-cli.exe ;;
            *) cli=dist/MathEngine/mathengine-cli ;;
          esac
          "$cli" code examples/sine_tracker.mathengine > /dev/null
          "$cli" render examples/sine_tracker.mathengine -q preview -o smoke.mp4
          test -s smoke.mp4
          # The editor's server serves the bundled interface (output to a file so the step doesn't wait on it).
          "$cli" --serve --port 8765 > serve.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8765/ -o index.html && break; sleep 1; done
          kill $pid 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM mathengine-cli.exe > /dev/null 2>&1 || true; fi
          cat serve.log
          grep -q '<div id="root">' index.html

      - name: Archive
        run: |
          name="MathEngine-${VERSION}-${{ matrix.name }}"
          mkdir -p out
          case "$RUNNER_OS" in
            macOS) ditto -c -k --keepParent dist/MathEngine.app "out/$name.zip" ;;
            Windows) (cd dist && 7z a -tzip "../out/$name.zip" MathEngine > /dev/null) ;;
            *) tar -C dist -czf "out/$name.tar.gz" MathEngine ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        run: |
          ls -lh out
          cat > notes.md <<'EOF'
          ## Downloads

          | Platform | File | Run it |
          |---|---|---|
          | Windows 10/11 (64-bit) | `*-windows-x64.zip` | Unzip, then run `MathEngine.exe`. If SmartScreen warns about an unrecognized app: **More info → Run anyway**. |
          | macOS (Apple Silicon) | `*-macos-arm64.zip` | Unzip and move `MathEngine.app` to Applications. The app isn't notarized: the first time, right-click it → **Open**. |
          | macOS (Intel) | `*-macos-x64.zip` | As above. |
          | Linux (x86-64) | `*-linux-x64.tar.gz` | Extract, then run `MathEngine/MathEngine`. |

          `mathengine-cli` next to the app renders from a terminal: `mathengine-cli render scene.mathengine -q 1080p`.

          **LaTeX** isn't included: `MathTex`/`Tex` objects, measurements and value labels (`DecimalNumber`) need a LaTeX installation (MiKTeX on Windows, MacTeX or BasicTeX on macOS, TeX Live on Linux). `Text` works without it.
          EOF
          gh release create "v${VERSION}" out/* \
            --target "${GITHUB_SHA}" \
            --title "MathEngine ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
